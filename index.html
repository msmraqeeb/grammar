<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrammarMaster Pro</title>
  <link rel="icon" type="image/png" href="/images/GrammarMasterPro-fav.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Support dark mode via tailwind
    tailwind.config = {
      darkMode: 'class'
    }

    // Prevent flash of light mode
    if (localStorage.getItem('grammar_dark_mode') === 'true') {
      document.documentElement.classList.add('dark');
    }

    // Polyfill process for browser environment to prevent Node SDK crashes
    window.process = { env: {} };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
